[project]
name = "fasalnama"
version = "0.1.0"
description = "A farm record investigator built on open-weight AI."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100