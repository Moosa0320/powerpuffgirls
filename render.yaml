services:
  - type: web
    name: FasalNama-api
    runtime: python
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RUN_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: FasalNama-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: STT_BACKEND
        value: groq
      - key: LLM_BACKEND
        value: groq
      - key: VISION_BACKEND
        value: groq
      - key: GROQ_STT_MODEL
        sync: false
      - key: GROQ_LLM_MODEL
        sync: false
      - key: GROQ_VISION_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: FasalNama-web
    runtime: static
    rootDir: app/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: FasalNama-db
    plan: free
